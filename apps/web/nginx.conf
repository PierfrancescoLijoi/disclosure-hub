# Edge limit for floods the API never sees as an authenticated actor (the API limits per actor).
limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;

# What Front Door caches in Azure: public reads only, shared for as long as the API says (30 s, 60 s for the feed).
proxy_cache_path /var/cache/nginx/public levels=1:2 keys_zone=public:5m max_size=50m inactive=10m;

server {
  listen 80;
  root /usr/share/nginx/html;

  # Re-resolve the API name every few seconds, so a recreated or scaled `api` (docker compose up --scale api=2) is
  # found without restarting this container. 127.0.0.11 is Docker's embedded DNS on the compose network.
  resolver 127.0.0.11 valid=5s ipv6=off;
  set $api http://api:3000;

  location /api/public/ {
    limit_req zone=api burst=200 nodelay;
    limit_req_status 429;
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_cache public;                       # GET and HEAD only; the subscription forms are POSTs and never cached
    proxy_cache_lock on;                      # a crowd for one page becomes one request
    proxy_cache_use_stale error timeout updating http_502 http_503;
    add_header X-Cache-Status $upstream_cache_status;
  }

  location /api/ {
    limit_req zone=api burst=200 nodelay;
    limit_req_status 429;
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    try_files $uri /index.html;
  }
}
